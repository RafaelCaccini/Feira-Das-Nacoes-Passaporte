<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passaporte — Feira das Nações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="flag-field" aria-hidden="true">
  <span>🇧🇷</span><span>🇨🇦</span><span>🇯🇵</span><span>🇲🇽</span><span>🇮🇹</span><span>🇫🇷</span>
  <span>🇮🇹</span><span>🇯🇵</span><span>🇧🇷</span><span>🇫🇷</span><span>🇨🇦</span><span>🇲🇽</span>
  <span>🇫🇷</span><span>🇲🇽</span><span>🇨🇦</span><span>🇧🇷</span><span>🇯🇵</span><span>🇮🇹</span>
  <span>🇨🇦</span><span>🇮🇹</span><span>🇲🇽</span><span>🇯🇵</span><span>🇫🇷</span><span>🇧🇷</span>
</div>
<div id="app">

  <!-- CAPA -->
  <div class="cover" id="cover">
    <div class="cover-panel">
      <svg class="cover-lines" viewBox="0 0 400 520" preserveAspectRatio="none" aria-hidden="true">
        <path d="M400,54 C282,146 244,300 400,468" />
        <path d="M400,96 C300,180 268,330 400,520" />
      </svg>
      <div class="texture-strip" aria-hidden="true"></div>

      <div class="mercosul">MERCOSUL</div>

      <div class="emblem" aria-hidden="true">
        <svg viewBox="0 0 200 210" class="brasao">
          <defs>
            <path id="ribbonPath" d="M30,150 Q100,180 170,150" />
          </defs>
          <g class="rays">
            <path d="M100,18 L108,92 L100,100 L92,92 Z"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(24 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(48 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(72 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(96 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(120 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(144 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(168 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(192 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(216 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(240 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(264 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(288 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(312 100 100)"/>
            <path d="M100,18 L108,92 L100,100 L92,92 Z" transform="rotate(336 100 100)"/>
          </g>
          <circle cx="100" cy="100" r="21" class="globe"/>
          <g class="cruzeiro">
            <circle cx="93" cy="90" r="1.6"/><circle cx="107" cy="93" r="1.6"/>
            <circle cx="100" cy="104" r="1.6"/><circle cx="90" cy="108" r="1.6"/>
            <circle cx="112" cy="110" r="1.1"/>
          </g>
          <path d="M58,150 C40,140 32,118 36,96" class="branch"/>
          <path d="M142,150 C160,140 168,118 164,96" class="branch"/>
          <text class="ribbon-text">
            <textPath href="#ribbonPath" startOffset="50%" text-anchor="middle">REPÚBLICA FEDERATIVA DO BRASIL</textPath>
          </text>
          <text x="100" y="172" class="ribbon-date" text-anchor="middle">15 de Novembro de 1889</text>
        </svg>
      </div>

      <div class="country-name">REPÚBLICA FEDERATIVA DO</div>
      <div class="doc-title">BRASIL</div>

      <div class="bottom-row">
        <div class="passaporte-block">
          <div class="passaporte-label">PASSAPORTE</div>
          <div class="event-tag">FEIRA DAS NAÇÕES</div>
        </div>
        <svg class="biometric-icon" viewBox="0 0 40 40" aria-hidden="true">
          <rect x="1.5" y="1.5" width="37" height="37" rx="4"/>
          <circle cx="20" cy="20" r="9"/>
          <circle cx="20" cy="20" r="3.2"/>
        </svg>
      </div>
    </div>

    <div class="cover-form">
      <input id="nameInput" placeholder="Nome do titular" maxlength="30" autocomplete="off">
      <button class="btn-gold" id="openBtn" type="button">Emitir passaporte</button>
      <p class="hint">Leia o QR code de cada país para carimbar sua página</p>
    </div>
  </div>

  <!-- LIVRETO -->
  <div class="book" id="book">
    <div class="book-header">
      <div class="header-row">
        <div>
          <div class="header-label">Titular</div>
          <div class="owner" id="ownerName">Viajante</div>
        </div>
        <svg viewBox="0 0 100 120" class="shield shield-small" aria-hidden="true">
          <path d="M50 4 L92 18 V56 C92 88 72 106 50 116 C28 106 8 88 8 56 V18 Z" />
          <circle cx="50" cy="50" r="21" class="shield-inner" />
          <path d="M50 33 L57 47 L72 49 L61 59 L64 74 L50 66 L36 74 L39 59 L28 49 L43 47 Z" class="shield-star"/>
        </svg>
      </div>
      <div class="progress"><span id="visitedCount">0</span> de <span id="totalCount">0</span> países visitados</div>
    </div>

    <div class="pages">
      <div class="stamp-grid" id="stampGrid"></div>
    </div>

    <div class="mrz" id="mrz"></div>

    <!-- <div class="footer-note">
      Ao ler o QR code de um país, o carimbo entra sozinho. Sem QR, é só tocar no país pra confirmar a visita.
      <br><button id="adminToggleBtn" type="button">painel para organizadores</button>
    </div>
    <div class="admin-panel" id="adminPanel"></div> -->
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
